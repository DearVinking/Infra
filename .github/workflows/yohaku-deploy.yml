name: Yohaku 部署

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的提交 SHA / 分支 / tag（留空为 main）
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: yohaku-deploy
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: DearVinking/Yohaku
  SOURCE_ENVIRONMENT: production

jobs:
  deploy:
    name: 构建镜像并部署
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: yohaku
    steps:
      - name: 检出本仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 解析提交并登记部署
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          sha="$(scripts/deployment.sh resolve "$SOURCE_REPOSITORY" "$REF")"
          id="$(scripts/deployment.sh create "$SOURCE_REPOSITORY" "$SOURCE_ENVIRONMENT" "$sha")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "部署 ${sha:0:7}（deployment #$id）"

      - name: 检查 secrets
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_REPO: ${{ secrets.ACR_REPO }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          KEY: ${{ secrets.KEY }}
          PORT: ${{ secrets.PORT }}
        run: |
          missing=()
          for name in CI_TOKEN ACR_REGISTRY ACR_NAMESPACE ACR_REPO ACR_USERNAME ACR_PASSWORD BASE_URL HOST USER KEY PORT; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::缺少配置（environment yohaku）: ${missing[*]}"
            exit 1
          fi

      - name: 检出 Yohaku
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ steps.deployment.outputs.sha }}
          token: ${{ secrets.CI_TOKEN }}
          path: src
          fetch-depth: 1
          lfs: true
          submodules: recursive
          persist-credentials: false

      - name: 拉取 LFS 文件
        run: scripts/quiet.sh lfs-checkout git -C src lfs checkout

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 暴露 Actions 缓存运行时
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送 Docker 镜像
        env:
          IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPO }}
          TAG: ${{ steps.deployment.outputs.sha }}-${{ github.run_number }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          scripts/quiet.sh docker-build docker buildx build \
            --file src/Dockerfile \
            --push \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            --cache-from "type=registry,ref=$IMAGE:latest" \
            --cache-from type=gha \
            --cache-to type=inline \
            --cache-to type=gha,mode=max \
            --build-arg BASE_URL \
            --build-arg API_URL \
            --provenance=false \
            --sbom=false \
            --progress=plain \
            src

      - name: SSH 部署到服务器
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.PORT }}
          SSH_USER: ${{ secrets.USER }}
          SSH_KEY: ${{ secrets.KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_TIMEOUT: "600"
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: >-
          scripts/quiet.sh ssh-deploy scripts/ssh-deploy.sh scripts/remote/yohaku.sh
          ACR_REGISTRY ACR_USERNAME ACR_PASSWORD

      - name: 更新部署状态
        if: always() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: scripts/deployment.sh status "$SOURCE_REPOSITORY" "$DEPLOYMENT_ID" "$STATE"
