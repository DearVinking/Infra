name: Astrionyx 发布和部署

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 总是检查 main 后端部署；填写版本 tag 时在同一次检查后发布应用
        required: false
        default: ""
        type: string
      retry:
        description: 人工恢复已失败或待处理阶段；自动事件转发关闭
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: astrionyx-desktop-stable-release
  queue: max
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"
  SOURCE_REPOSITORY: DearVinking/Astrionyx
  QUIET: ${{ github.workspace }}/scripts/quiet.sh

jobs:
  prepare:
    name: 判断发布和部署条件
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: astrionyx
    outputs:
      run: ${{ steps.plan.outputs.run }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      deploy: ${{ steps.plan.outputs.deploy }}
      deploy_sha: ${{ steps.plan.outputs.deploy_sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag || '' }}
      REPORT_NAME: delivery_prepare
      REPORT_PATHS: ""
    steps:
      - &checkout-infra
        name: 检出 Infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - &setup-node
        name: 设置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: 检查交付配置
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
        run: |
          test -n "$CI_TOKEN"
          test -n "$ENCRYPTION_PASSPHRASE"

      - name: 解析源码快照
        id: snapshot
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
        run: node scripts/source-delivery.mjs snapshot

      - name: 检出触发判断所需历史
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.sha }}
        run: |
          "$QUIET" checkout bash scripts/checkout-source.sh "$SOURCE_SHA" 0

      - name: 确定发布或部署阶段
        id: plan
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.sha }}
          RETRY_DELIVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.retry }}
        run: |
          "$QUIET" prepare-delivery node scripts/source-delivery.mjs prepare

      - name: 解析提交并登记检查
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_REF: ${{ steps.plan.outputs.sha }}
        run: node scripts/source-ci.mjs start

      - name: 整理触发判断诊断
        if: always()
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
          CI_JOB_RESULT: ${{ job.status }}
        run: |
          "$QUIET" prepare-reports bash scripts/ci-reports.sh "$REPORT_NAME"

      - name: 保存触发判断诊断
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-prepare-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-reports/delivery_prepare.enc
          if-no-files-found: error
          retention-days: 7

  web_tests:
    name: Web quality and coverage
    if: needs.prepare.outputs.run == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: astrionyx
    defaults: &source-run
      run:
        working-directory: src
    env:
      REPORT_NAME: web_tests
      REPORT_PATHS: coverage/lcov.info
      ASTRIONYX_INFRA_ROOT: ${{ github.workspace }}
    steps:
      - *checkout-infra
      - &checkout-source
        name: 检出固定提交
        id: tools
        working-directory: ${{ github.workspace }}
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          "$QUIET" checkout bash scripts/checkout-source.sh "$SOURCE_SHA" 1
          "$QUIET" tool-versions node scripts/source-tools.mjs

      - &setup-pnpm
        name: 设置 pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ steps.tools.outputs.pnpm }}
          package_json_file: tool-versions.json
          run_install: false
          cache: false

      - *setup-node
      - &setup-go
        name: 设置 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false

      - &install-node
        name: 安装依赖
        run: |
          "$QUIET" install pnpm install --frozen-lockfile

      - name: 检查 Web 代码、类型、配置及依赖边界
        run: '"$QUIET" lint-web pnpm lint:web'

      - name: 验证交付规则与 Go 分组报告
        run: '"$QUIET" infra-tests node --test "$GITHUB_WORKSPACE"/tests/*.test.mjs'

      - name: 生成 Web 覆盖率
        run: |
          "$QUIET" web-coverage pnpm test:coverage --test-concurrency=2 --test-reporter=spec

      - &seal-reports
        name: 整理报告与诊断
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
          CI_JOB_RESULT: ${{ job.status }}
        run: |
          "$QUIET" prepare-reports bash scripts/ci-reports.sh "$REPORT_NAME"

      - &upload-reports
        name: 保存检查报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-${{ env.REPORT_NAME }}
          path: ${{ runner.temp }}/ci-reports/${{ env.REPORT_NAME }}.enc
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  go_tests:
    name: Go test coverage (${{ matrix.group }})
    if: needs.prepare.outputs.run == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: astrionyx
    defaults: *source-run
    strategy:
      fail-fast: false
      matrix:
        group: [large_import, remaining]
    env:
      REPORT_NAME: go_tests-${{ matrix.group }}
      REPORT_PATHS: ${{ matrix.group == 'remaining' && 'apps/api/coverage.out apps/api/coverage-shared.out coverage/go-tests' || 'coverage/go-tests' }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      GO_TEST_GROUP: ${{ matrix.group }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - *checkout-infra
      - *checkout-source
      - *setup-node
      - *setup-go
      - name: 生成 API 覆盖率
        if: matrix.group == 'remaining'
        env:
          AST_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          "$QUIET" api-coverage go -C apps/api test -json -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
      - name: 检查共享规则和官方抓取
        if: matrix.group == 'remaining'
        run: |
          set -euo pipefail
          "$QUIET" shared-core go -C packages/gacha-core test -json -race -count=1 -coverprofile="$GITHUB_WORKSPACE/src/apps/api/coverage-shared.out" ./...
          "$QUIET" shared-fetch go -C packages/gacha-fetch test -json -race -count=1 ./...
      - name: 检查 SQLite 与桌面核心
        run: |
          "$QUIET" desktop-core node "$GITHUB_WORKSPACE/scripts/go-test-groups.mjs" run "$GO_TEST_GROUP"
      - name: 验证跨平台编译边界
        if: matrix.group == 'remaining'
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            "$QUIET" "api-$arch" env CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go -C apps/api build -o "$RUNNER_TEMP/api-$arch" ./cmd/server
            "$QUIET" "desktop-$arch" env CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go -C apps/desktop/core test -c -o "$RUNNER_TEMP/desktop-$arch.test.exe"
          done
      - name: 检查 PostgreSQL 所有权修复
        if: matrix.group == 'remaining'
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          "$QUIET" ownership sh script/test-db-ownership.sh
      - *seal-reports
      - *upload-reports

  desktop_macos:
    name: macOS desktop quality
    if: needs.prepare.outputs.run == 'true'
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 90
    environment: astrionyx
    outputs:
      main_thread: ${{ steps.main_thread.outcome }}
    defaults: *source-run
    env:
      REPORT_NAME: desktop_macos
      REPORT_PATHS: coverage/macos
      AST_TEST_SYNC_RECOVERY_UI_DIRECTORY: ${{ github.workspace }}/src/coverage/macos/resolution-ui
    steps:
      - *checkout-infra
      - *checkout-source
      - &select-xcode
        name: 选择 Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - *setup-pnpm
      - *setup-node
      - *setup-go
      - *install-node
      - name: 检查 Go 代码和依赖漏洞
        run: '"$QUIET" lint-go pnpm lint:go'
      - name: 构建并校验 macOS 宿主
        run: |
          "$QUIET" desktop-check pnpm desktop:macos check
      - name: 检查 Swift 格式与规则
        run: |
          "$QUIET" swift-lint pnpm lint:macos
      - name: 生成 macOS 覆盖率
        run: |
          "$QUIET" swift-coverage pnpm test:macos:coverage
      - name: 检查未使用的 Swift 声明
        run: |
          "$QUIET" swift-unused node script/macos-quality.mjs unused --skip-build
      - name: 检查原生窗口线程
        id: main_thread
        run: |
          "$QUIET" main-thread node script/macos-quality.mjs main-thread
      - *seal-reports
      - *upload-reports

  desktop_macos_go:
    name: macOS Go race
    if: needs.prepare.outputs.run == 'true'
    needs: [prepare, desktop_macos]
    runs-on: macos-26
    timeout-minutes: 180
    environment: astrionyx
    defaults: *source-run
    env:
      REPORT_NAME: desktop_macos_go
      REPORT_PATHS: coverage/go-tests
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - *checkout-infra
      - *checkout-source
      - *select-xcode
      - *setup-node
      - *setup-go
      - name: 检查桌面 Go race（大文件导入）
        id: large_import
        run: '"$QUIET" desktop-race-large node "$GITHUB_WORKSPACE/scripts/go-test-groups.mjs" run large_import'
      - name: 检查桌面 Go race（其余用例）
        if: ${{ !cancelled() && (steps.large_import.outcome == 'success' || steps.large_import.outcome == 'failure') }}
        run: '"$QUIET" desktop-race-remaining node "$GITHUB_WORKSPACE/scripts/go-test-groups.mjs" run remaining'
      - *seal-reports
      - *upload-reports

  desktop_macos_sanitizer:
    name: macOS ${{ matrix.sanitizer }} sanitizer
    if: needs.prepare.outputs.run == 'true'
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 90
    environment: astrionyx
    defaults: *source-run
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sanitizer: [address, thread]
    env:
      REPORT_NAME: desktop_macos_sanitizer-${{ matrix.sanitizer }}
      REPORT_PATHS: coverage/macos
    steps:
      - *checkout-infra
      - *checkout-source
      - *select-xcode
      - *setup-node
      - *setup-go
      - name: 运行 Swift sanitizer
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          "$QUIET" swift-sanitizer node script/macos-quality.mjs sanitize "$SANITIZER"
      - *seal-reports
      - *upload-reports

  desktop_macos_main_thread:
    name: Main Thread Checker result
    if: needs.prepare.outputs.run == 'true'
    needs: [prepare, desktop_macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 校验原生窗口线程检测结果
        env:
          MAIN_THREAD_RESULT: ${{ needs.desktop_macos.outputs.main_thread }}
        run: |
          test "$MAIN_THREAD_RESULT" = success

  desktop_macos_integration:
    name: macOS real API integration
    if: needs.prepare.outputs.run == 'true'
    needs: [prepare, desktop_macos_sanitizer]
    runs-on: macos-26
    timeout-minutes: 90
    environment: astrionyx
    defaults: *source-run
    env:
      REPORT_NAME: desktop_macos_integration
      REPORT_PATHS: coverage/macos
    steps:
      - *checkout-infra
      - *checkout-source
      - *select-xcode
      - *setup-node
      - *setup-go
      - name: 安装 PostgreSQL
        run: brew install postgresql@18
      - name: 运行隔离 API 集成测试
        run: |
          "$QUIET" integration env AST_TEST_POSTGRES_BIN="$(brew --prefix postgresql@18)/bin" node script/macos-integration.mjs
      - *seal-reports
      - *upload-reports

  ci:
    name: 汇总完整 CI
    outputs:
      sha: ${{ needs.prepare.outputs.sha }}
    if: ${{ always() && needs.prepare.outputs.run == 'true' }}
    needs:
      [
        prepare,
        web_tests,
        go_tests,
        desktop_macos,
        desktop_macos_go,
        desktop_macos_sanitizer,
        desktop_macos_main_thread,
        desktop_macos_integration,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: astrionyx
    defaults: *source-run
    env:
      REPORT_NAME: build
      REPORT_PATHS: apps/api/coverage.out apps/api/coverage-shared.out apps/api/coverage-desktop.out coverage/go-tests
    steps:
      - *checkout-infra
      - *setup-node
      - name: 要求全部检查成功
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/source-ci.mjs gate
      - name: 下载 Go 检查报告
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ci-go_tests-*
          path: ${{ runner.temp }}/ci-go-download
          merge-multiple: true
      - name: 下载 macOS Go 检查报告
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-desktop_macos_go
          path: ${{ runner.temp }}/ci-macos-go-download
      - name: 合并 Go 测试清单与覆盖率
        working-directory: ${{ github.workspace }}
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          "$QUIET" go-reports bash -euo pipefail -c '
            mkdir -p "$RUNNER_TEMP/go-reports" "$RUNNER_TEMP/go-macos-reports"
            for group in large_import remaining; do
              node scripts/ci-artifacts.mjs open "$RUNNER_TEMP/ci-go-download/go_tests-$group.enc" "$RUNNER_TEMP/go-reports/$group.tar.gz"
              tar -xzf "$RUNNER_TEMP/go-reports/$group.tar.gz" -C "$RUNNER_TEMP/go-reports" "coverage/go-tests/$group"
            done
            node scripts/ci-artifacts.mjs open "$RUNNER_TEMP/ci-macos-go-download/desktop_macos_go.enc" "$RUNNER_TEMP/go-macos-reports/reports.tar.gz"
            tar -xzf "$RUNNER_TEMP/go-macos-reports/reports.tar.gz" -C "$RUNNER_TEMP/go-macos-reports" coverage/go-tests
            env GITHUB_WORKSPACE="$RUNNER_TEMP/go-macos-merge" node scripts/go-test-groups.mjs merge "$RUNNER_TEMP/go-macos-reports/coverage/go-tests"
            mkdir -p src/apps/api
            tar -xzf "$RUNNER_TEMP/go-reports/remaining.tar.gz" -C src apps/api/coverage.out apps/api/coverage-shared.out
            node scripts/go-test-groups.mjs merge "$RUNNER_TEMP/go-reports/coverage/go-tests"
          '
