          CI_RESULT: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: node scripts/source-ci.mjs finish

  deploy:
    name: 构建并部署后端
    if: needs.prepare.outputs.deploy == 'true'
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: astrionyx
    env:
      SOURCE_ENVIRONMENT: production
      REPORT_NAME: backend_deploy
      REPORT_PATHS: ""
    steps:
      - *checkout-infra
      - *setup-node

      - name: 检查部署配置
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_REPO: ${{ secrets.ACR_REPO }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          KEY: ${{ secrets.KEY }}
          PORT: ${{ secrets.PORT }}
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
        run: |
          missing=()
          for name in CI_TOKEN ACR_REGISTRY ACR_NAMESPACE ACR_REPO ACR_USERNAME ACR_PASSWORD HOST USER KEY PORT ENCRYPTION_PASSPHRASE; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::缺少配置（environment astrionyx）: ${missing[*]}"
            exit 1
          fi

      - name: 绑定已验证的固定部署提交
        id: source
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_SHA: ${{ needs.ci.outputs.sha }}
          DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
        run: node scripts/source-ci.mjs deploy-source

      - name: 登记源仓库部署
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          id="$(scripts/deployment.sh create "$SOURCE_REPOSITORY" "$SOURCE_ENVIRONMENT" "$SOURCE_SHA")"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "登记部署（deployment #$id）"

      - name: 检出固定提交
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          "$QUIET" checkout bash scripts/checkout-source.sh "$SOURCE_SHA" 1

      - name: 部署回归测试
        env:
          ASTRIONYX_INFRA_ROOT: ${{ github.workspace }}
        run: |
          "$QUIET" deploy-test node --test src/script/deploy-readiness.test.mjs

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送 Docker 镜像
        env:
          IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPO }}
          TAG: sha-${{ steps.source.outputs.sha }}
        run: |
          scripts/quiet.sh docker-build docker buildx build \
            --file src/apps/api/Dockerfile \
            --push \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            --cache-from "type=registry,ref=$IMAGE:latest" \
            --cache-to type=inline \
            --provenance=false \
            --sbom=false \
            --progress=plain \
            src

      - name: SSH 部署后端
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.PORT }}
          SSH_USER: ${{ secrets.USER }}
          SSH_KEY: ${{ secrets.KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_TIMEOUT: "600"
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          API_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPO }}:sha-${{ steps.source.outputs.sha }}
        run: >-
          scripts/quiet.sh ssh-deploy scripts/ssh-deploy.sh scripts/remote/astrionyx.sh
          ACR_REGISTRY ACR_USERNAME ACR_PASSWORD API_IMAGE

      - name: 更新部署状态
        if: always() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: scripts/deployment.sh status "$SOURCE_REPOSITORY" "$DEPLOYMENT_ID" "$STATE"

      - name: 整理构建与部署诊断
        if: always()
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
          CI_JOB_RESULT: ${{ job.status }}
        run: |
          "$QUIET" prepare-reports bash scripts/ci-reports.sh "$REPORT_NAME"

      - name: 保存部署诊断
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-backend-deploy-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-reports/backend_deploy.enc
          if-no-files-found: error
          retention-days: 7

  release:
    name: 验证并发布 macOS 产物
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.ci.result == 'success' &&
        needs.prepare.outputs.release == 'true' &&
        ((needs.prepare.outputs.deploy == 'true' && needs.deploy.result == 'success') ||
         (needs.prepare.outputs.deploy == 'false' && needs.deploy.result == 'skipped')) }}
    needs: [prepare, ci, deploy]
    runs-on: macos-26
    timeout-minutes: 180
    environment: astrionyx-release
    defaults:
      run:
        working-directory: src
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      REPORT_NAME: macos_release
      REPORT_PATHS: ""
      ASTX_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - *checkout-infra
      - *setup-node

      - name: 检查发行配置
        working-directory: ${{ github.workspace }}
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DESKTOP_RELEASE_SETTINGS_TOKEN: ${{ secrets.DESKTOP_RELEASE_SETTINGS_TOKEN }}
        run: |
          missing=()
          for name in CI_TOKEN ENCRYPTION_PASSPHRASE SPARKLE_PRIVATE_KEY DESKTOP_RELEASE_SETTINGS_TOKEN ASTX_SPARKLE_PUBLIC_KEY; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::缺少发行配置（environment astrionyx-release）: ${missing[*]}"
            exit 1
          fi

      - name: 绑定版本 tag 与本次成功检查
        id: source
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_SHA: ${{ needs.ci.outputs.sha }}
        run: node scripts/source-ci.mjs release-source

      - name: 检出固定提交
        id: tools
        working-directory: ${{ github.workspace }}
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          "$QUIET" checkout bash scripts/checkout-source.sh "$SOURCE_SHA" 1
          "$QUIET" tool-versions node scripts/source-tools.mjs

      - name: 选择 Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: 设置 pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ steps.tools.outputs.pnpm }}
          package_json_file: tool-versions.json
          run_install: false
          cache: false

      - name: 校验版本、公钥及不可变发布设置
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          ASTX_RELEASE_SETTINGS_TOKEN: ${{ secrets.DESKTOP_RELEASE_SETTINGS_TOKEN }}
        run: |
          "$QUIET" release-preflight env \
            GITHUB_REPOSITORY="$SOURCE_REPOSITORY" \
            GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_TYPE=tag \
            GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_NAME="$RELEASE_TAG" \
            node script/desktop-release.mjs preflight

      - name: 设置 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false

      - name: 安装依赖
        run: |
          "$QUIET" install pnpm install --frozen-lockfile

      - name: 获取固定 Sparkle 的官方签名工具
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$QUIET" sparkle-tools bash -euo pipefail <<'SH'
          version="$(node --input-type=module -e 'import fs from "node:fs"; const data=JSON.parse(fs.readFileSync("apps/desktop/macos/Package.resolved","utf8")); const version=data.pins.find(pin=>pin.identity==="sparkle").state.version; if(!/^\d+\.\d+\.\d+$/.test(version))process.exit(1); process.stdout.write(version)')"
          gh api "repos/sparkle-project/Sparkle/releases/tags/${version}" > "$RUNNER_TEMP/sparkle-release.json"
          node --input-type=module - "$RUNNER_TEMP" "$version" <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const [directory,version]=process.argv.slice(2);
          const release=JSON.parse(fs.readFileSync(path.join(directory,"sparkle-release.json"),"utf8"));
          const assets=release.assets.filter(asset=>asset.name===`Sparkle-${version}.tar.xz`);
          if(assets.length!==1 || !/^sha256:[a-f0-9]{64}$/.test(assets[0].digest))throw new Error("Sparkle tool digest missing");
          fs.writeFileSync(path.join(directory,"sparkle.sha256"),`${assets[0].digest.slice(7)}  ${path.join(directory,"sparkle.tar.xz")}\n`);
          NODE
          curl --disable --fail --location --proto '=https' --proto-redir '=https' \
            "https://github.com/sparkle-project/Sparkle/releases/download/${version}/Sparkle-${version}.tar.xz" \
            --output "$RUNNER_TEMP/sparkle.tar.xz"
          shasum -a 256 -c "$RUNNER_TEMP/sparkle.sha256"
          mkdir "$RUNNER_TEMP/astrionyx-sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/astrionyx-sparkle"
          echo "ASTX_SPARKLE_SIGN_UPDATE=$RUNNER_TEMP/astrionyx-sparkle/bin/sign_update" >> "$GITHUB_ENV"
          SH

      - name: 准备临时更新签名材料
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const file=path.join(process.env.RUNNER_TEMP,"astrionyx-sparkle-private-key");
          fs.writeFileSync(file,process.env.SPARKLE_PRIVATE_KEY,{flag:"wx",mode:0o600});
          fs.appendFileSync(process.env.GITHUB_ENV,`ASTX_SPARKLE_PRIVATE_KEY_FILE=${file}\n`);
          NODE

      - name: 生成 DMG、更新 ZIP 并验签候选
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          ASTX_RELEASE_SETTINGS_TOKEN: ${{ secrets.DESKTOP_RELEASE_SETTINGS_TOKEN }}
        run: |
          "$QUIET" prepare-release env \
            GITHUB_REPOSITORY="$SOURCE_REPOSITORY" \
            GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_TYPE=tag \
            GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_NAME="$RELEASE_TAG" \
            node script/desktop-release.mjs prepare

      - name: 整理调试符号
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
        run: |
          "$QUIET" prepare-symbols bash -euo pipefail <<'SH'
          tar -czf "$RUNNER_TEMP/release-symbols.tar.gz" -C apps/desktop/macos/dist Astrionyx.app.dSYM
          node "$GITHUB_WORKSPACE/scripts/ci-artifacts.mjs" seal "$RUNNER_TEMP/release-symbols.tar.gz" "$RUNNER_TEMP/release-symbols.enc"
          rm -f "$RUNNER_TEMP/release-symbols.tar.gz"
          SH

      - name: 保存调试符号
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-release-symbols-${{ needs.prepare.outputs.tag }}-${{ github.run_number }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-symbols.enc
          if-no-files-found: error
          retention-days: 90

      - name: 验证 draft 原字节并发布不可变 Release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          ASTX_RELEASE_SETTINGS_TOKEN: ${{ secrets.DESKTOP_RELEASE_SETTINGS_TOKEN }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/source-ci.mjs" release-source
          "$QUIET" publish-release env \
            GITHUB_REPOSITORY="$SOURCE_REPOSITORY" \
            GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_TYPE=tag \
            GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_NAME="$RELEASE_TAG" \
            node script/desktop-release.mjs publish \
            "apps/desktop/macos/dist/releases/${RELEASE_TAG}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}/release.json"

      - name: 清理临时私钥
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/astrionyx-sparkle-private-key"

      - name: 整理质量报告与发行诊断
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
          CI_JOB_RESULT: ${{ job.status }}
        run: |
          "$QUIET" prepare-reports bash scripts/ci-reports.sh "$REPORT_NAME"

      - name: 保存发行诊断
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-release-quality-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-reports/macos_release.enc
          if-no-files-found: error
          retention-days: 7

  finish:
    name: 登记本次发布或部署结果
    if: ${{ always() && needs.prepare.outputs.run == 'true' }}
    needs: [prepare, ci, release, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: astrionyx
    steps:
      - *checkout-infra
      - *setup-node
      - name: 回写本次发布或部署结果
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_REQUIRED: ${{ needs.prepare.outputs.release }}
          DEPLOY_REQUIRED: ${{ needs.prepare.outputs.deploy }}
          DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/source-delivery.mjs finish

  cleanup:
    name: 清理成功运行的全部 Actions 产物
    if: >-
      ${{ always() && !cancelled() && needs.prepare.result == 'success' &&
        ((needs.prepare.outputs.run == 'false' &&
          needs.web_tests.result == 'skipped' &&
          needs.go_tests.result == 'skipped' &&
          needs.desktop_macos.result == 'skipped' &&
          needs.desktop_macos_go.result == 'skipped' &&
          needs.desktop_macos_sanitizer.result == 'skipped' &&
          needs.desktop_macos_main_thread.result == 'skipped' &&
          needs.desktop_macos_integration.result == 'skipped' &&
          needs.ci.result == 'skipped' && needs.finish.result == 'skipped' &&
          needs.release.result == 'skipped' && needs.deploy.result == 'skipped') ||
         (needs.prepare.outputs.run == 'true' &&
          needs.web_tests.result == 'success' &&
          needs.go_tests.result == 'success' &&
          needs.desktop_macos.result == 'success' &&
          needs.desktop_macos_go.result == 'success' &&
          needs.desktop_macos_sanitizer.result == 'success' &&
          needs.desktop_macos_main_thread.result == 'success' &&
          needs.desktop_macos_integration.result == 'success' &&
          needs.ci.result == 'success' && needs.finish.result == 'success' &&
          ((needs.prepare.outputs.release == 'true' && needs.release.result == 'success') ||
           (needs.prepare.outputs.release == 'false' && needs.release.result == 'skipped')) &&
          ((needs.prepare.outputs.deploy == 'true' && needs.deploy.result == 'success') ||
           (needs.prepare.outputs.deploy == 'false' && needs.deploy.result == 'skipped')))) }}
    needs:
      [
        prepare,
        web_tests,
        go_tests,
        desktop_macos,
        desktop_macos_go,
        desktop_macos_sanitizer,
        desktop_macos_main_thread,
        desktop_macos_integration,
        ci,
        release,
        deploy,
        finish,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - *checkout-infra
      - *setup-node
      - name: 清空本轮 Actions 产物并确认无余留
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/cleanup-run-artifacts.mjs
