name: Streak 游戏签到

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streak-checkin
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: DearVinking/Streak

jobs:
  checkin:
    name: 执行签到
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: streak
    defaults:
      run:
        working-directory: src
    env:
      TZ: Asia/Shanghai
      QUIET: ${{ github.workspace }}/scripts/quiet.sh
    steps:
      - name: 检出本仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 检查 secrets
        working-directory: ${{ github.workspace }}
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          missing=()
          for name in CI_TOKEN CONFIG_YAML; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::缺少配置: ${missing[*]}"
            exit 1
          fi

      - name: 检出 Streak
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          token: ${{ secrets.CI_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: 设置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/pyproject.toml

      - name: 安装依赖
        run: |
          $QUIET pip-upgrade python -m pip install --upgrade pip
          $QUIET pip-install pip install -e .

      - name: 写入配置
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          python - <<'PY'
          import os, sys, yaml
          raw = os.environ.get("CONFIG_YAML", "")
          if not raw.strip():
              sys.exit("CONFIG_YAML secret 为空")
          parsed = yaml.safe_load(raw)
          if not isinstance(parsed, dict) or not parsed.get("users"):
              sys.exit("CONFIG_YAML 必须为 mapping 并包含 users")
          with open("config.yaml", "w", encoding="utf-8") as f:
              f.write(raw if raw.endswith("\n") else raw + "\n")
          PY

      - name: 执行签到
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TAJIDUO_APPVERSION: ${{ secrets.TAJIDUO_APPVERSION }}
          TAJIDUO_DS_SALT: ${{ secrets.TAJIDUO_DS_SALT }}
        run: $QUIET checkin python -m streak
