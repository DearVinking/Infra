name: Streak 游戏签到

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streak-checkin
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: DearVinking/Streak

jobs:
  checkin:
    name: 执行签到
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: streak
    defaults:
      run:
        working-directory: src
    env:
      TZ: Asia/Shanghai
      QUIET: ${{ github.workspace }}/scripts/quiet.sh
    steps:
      - name: 检出本仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 检查 secrets
        working-directory: ${{ github.workspace }}
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          missing=()
          for name in CI_TOKEN CONFIG_YAML; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::缺少配置: ${missing[*]}"
            exit 1
          fi

      - name: 检出 Streak
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          token: ${{ secrets.CI_TOKEN }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: 设置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/pyproject.toml

      - name: 安装依赖
        run: |
          $QUIET pip-upgrade python -m pip install --upgrade pip
          $QUIET pip-install pip install -e .

      - name: 写入配置
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          python - <<'PY'
          import os, sys, yaml
          raw = os.environ.get("CONFIG_YAML", "")
          if not raw.strip():
              sys.exit("CONFIG_YAML secret 为空")
          parsed = yaml.safe_load(raw)
          if not isinstance(parsed, dict) or not parsed.get("users"):
              sys.exit("CONFIG_YAML 必须为 mapping 并包含 users")
          with open("config.yaml", "w", encoding="utf-8") as f:
              f.write(raw if raw.endswith("\n") else raw + "\n")
          PY

      - name: 配置推送服务器直连
        env:
          PUSH_ORIGIN_IP: ${{ secrets.PUSH_ORIGIN_IP }}
        run: |
          set -euo pipefail
          if [[ -z "$PUSH_ORIGIN_IP" ]]; then
            exit 0
          fi
          python - <<'PYORIGIN' | sudo tee -a /etc/hosts >/dev/null
          import ipaddress, os
          print(str(ipaddress.ip_address(os.environ['PUSH_ORIGIN_IP'])) + ' push.vinking.top')
          PYORIGIN
          echo "已配置推送直连，保留 HTTPS 证书校验"

      - name: 执行签到
        run: $QUIET checkin python -m streak

      - name: 输出通知状态
        if: always()
        run: |
          python - <<'PYNOTICE'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'private-logs' / 'checkin.log'
          text = path.read_text(encoding='utf-8', errors='replace') if path.is_file() else ''
          if '自定义 Webhook 推送失败' in text or 'Message push failed!' in text or 'HTTP 207' in text:
              print('::error::签到通知发送失败，请检查推送服务')
              raise SystemExit(1)
          elif '自定义 Webhook 推送成功:' in text or 'Message push successful!' in text:
              print('签到通知: 推送请求成功')
          elif 'notification skipped' in text:
              print('签到通知: 签到成功且余额没有变化，按现有规则跳过通知')
          else:
              print('签到通知: 本次未产生通知发送结果')
          PYNOTICE

      - name: 输出失败分类
        if: failure()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'private-logs' / 'checkin.log'
          if not log.is_file():
              print('签到诊断: 未产生签到日志')
          else:
              text = log.read_text(encoding='utf-8', errors='replace')
              for game in ('鸣潮', '异环', '明日方舟', '终末地', '森空岛'):
                  for status in ('签到失败', '签到成功', '已签到'):
                      if f'{game}\n    - {status}' in text:
                          print(f'签到诊断: {game}={status}')
              categories = {
                  '设备指纹': '设备指纹服务失败',
                  'SDK 登录': 'SDK 登录失败',
                  '网络请求失败': '网络请求失败',
                  '登录已过期': '登录已过期',
                  '授权失败': '森空岛授权失败',
                  '换取 cred 失败': '森空岛凭证交换失败',
                  '获取绑定列表失败': '森空岛角色查询失败',
                  '无效响应': '响应格式错误',
                  '解析响应失败': '响应解析失败',
              }
              for needle, category in categories.items():
                  if needle in text:
                      print(f'签到诊断: {category}')
          PY
